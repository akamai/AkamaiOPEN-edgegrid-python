name: Publish to PyPI

# Triggered by releases and prereleases, but not by draft releases.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build source distribution and wheel
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build frontend
        run: python -m pip install --upgrade build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Publish to TestPyPI (both releases and prereleases)
  # ---------------------------------------------------------------------------
  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/edgegrid-python

    permissions:
      id-token: write   # required for OIDC Trusted Publisher authentication

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ---------------------------------------------------------------------------
  # 3. Publish to PyPI (releases only)
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Only publish real PyPI for stable GitHub Releases, not prereleases.
    if: ${{ !github.event.release.prerelease }}

    environment:
      name: pypi
      url: https://pypi.org/p/edgegrid-python

    permissions:
      id-token: write   # required for OIDC Trusted Publisher authentication

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
